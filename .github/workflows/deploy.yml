name: CI/CD with SonarCloud, Docker Hub and Render

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  # ==========================================================
  # 1. SONARCLOUD QUALITY CHECK
  # ==========================================================
  sonar:
    name: SonarCloud Quality Check
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      # --------------------------------------------------------
      # Install frontend dependencies
      # --------------------------------------------------------
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # --------------------------------------------------------
      # Generate LCOV coverage report
      # --------------------------------------------------------
      - name: Run frontend tests with coverage
        working-directory: frontend
        run: npm run test:coverage

      # --------------------------------------------------------
      # Verify coverage file exists
      # --------------------------------------------------------
      - name: Verify coverage report
        run: |
          if [ ! -f frontend/coverage/lcov.info ]; then
            echo "ERROR: frontend/coverage/lcov.info was not generated."
            exit 1
          fi

          echo "Coverage report found:"
          ls -lh frontend/coverage/lcov.info

      # --------------------------------------------------------
      # SonarCloud Scan
      # --------------------------------------------------------
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=24a31a42h7-1
            -Dsonar.projectKey=24A31A42H7_RailSync-Ai
            -Dsonar.sources=backend,frontend
            -Dsonar.tests=frontend
            -Dsonar.test.inclusions=frontend/**/*.test.js,frontend/**/*.test.jsx
            -Dsonar.exclusions=**/node_modules/**,**/venv/**,**/.venv/**,**/__pycache__/**,**/dist/**,**/build/**,**/coverage/**,k8s/**,.github/**,docker-compose.yml
            -Dsonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

      # --------------------------------------------------------
      # SonarCloud Quality Gate
      # --------------------------------------------------------
      - name: Check SonarCloud Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1.2.0
        timeout-minutes: 10
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}


  # ==========================================================
  # 2. BUILD AND PUSH DOCKER IMAGES
  # ==========================================================
  docker:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    # Docker runs ONLY when SonarCloud passes
    needs: sonar

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # --------------------------------------------------------
      # Docker Hub Login
      # --------------------------------------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # --------------------------------------------------------
      # Docker Buildx
      # --------------------------------------------------------
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@18ce135bb5112fa8ce4ed6c17ab05699d7f3a5e0 # v3.11.0

      # ========================================================
      # BACKEND
      # ========================================================

      - name: Build and Push Backend Image
        uses: docker/build-push-action@10e90e3c7b5c6f8e3f5c6e4d4a0e7f8f9b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6 # v6.19.2
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          no-cache: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/backend:latest

      # ========================================================
      # FRONTEND
      # ========================================================

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@10e90e3c7b5c6f8e3f5c6e4d4a0e7f8f9b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6 # v6.19.2
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          no-cache: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/frontend:latest


  # ==========================================================
  # 3. DEPLOY BACKEND TO RENDER
  # ==========================================================
  deploy-backend:
    name: Deploy Backend to Render
    runs-on: ubuntu-latest

    needs: docker

    steps:

      - name: Trigger Backend Render Deployment
        run: |
          set -e

          echo "Triggering Backend Render deployment..."

          curl --fail \
               --silent \
               --show-error \
               -X POST \
               "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK_URL }}"

          echo "Backend deployment triggered successfully."


  # ==========================================================
  # 4. DEPLOY FRONTEND TO RENDER
  # ==========================================================
  deploy-frontend:
    name: Deploy Frontend to Render
    runs-on: ubuntu-latest

    needs: docker

    steps:

      - name: Trigger Frontend Render Deployment
        run: |
          set -e

          echo "Triggering Frontend Render deployment..."

          curl --fail \
               --silent \
               --show-error \
               -X POST \
               "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK_URL }}"

          echo "Frontend deployment triggered successfully."