services:

  backend:
    build:
      context: ./backend

    restart: unless-stopped

    env_file:
      - ./backend/.env

    depends_on:
      - postgres

    ports:
      - "8000:8000"

    networks:
      - app-network


  frontend:
    build:
      context: ./frontend

    restart: unless-stopped

    environment:
      VITE_API_BASE_URL: http://localhost:8000

    depends_on:
      - backend

    ports:
      - "5173:5173"

    networks:
      - app-network


  postgres:
    image: postgres:16-alpine

    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"

    networks:
      - app-network


networks:
  app-network:
    driver: bridge